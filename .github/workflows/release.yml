name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    uses: ./.github/workflows/build.yml 

  release:
    runs-on: ubuntu-latest
    needs: build # Ensures job sequence

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./out # Downloads files back into this folder

      - name: Verify archive exists
        run: ls -la ./out

      - name: Archive
        run: |
          tar -czf deployd-ui.tar.gz out

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: deployd-ui.tar.gz

  upload:
    runs-on: ubuntu-latest
    needs: build # Ensures job sequence
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ./out # Downloads files back into this folder

      - name: Verify archive exists
        run: ls -la ./out

      - name: Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:desain-gratis-ci

      - name: Send deploy metadata
        uses: desain-gratis/deployd-gh-action@v1
        with:
          url: http://hz1:9401
          namespace: deployd
          name: deployd-ui
          build-script: echo "hello"
          archive: ./out